# MkDocs configuration file.
# https://www.mkdocs.org/user-guide/configuration/

# Project information.
site_name: OpenVidu v2 Docs
# Fixed to the stable version path on purpose: MkDocs derives every page's
# canonical URL and the sitemap from it, and all versions must point at stable.
site_url: https://docs.openvidu.io/en/stable/
repo_url: https://github.com/OpenVidu/openvidu.io-docs
edit_uri: blob/master/docs/
site_description: Documentation for OpenVidu v2, the legacy version of OpenVidu. New projects should use OpenVidu v3 at openvidu.io.

